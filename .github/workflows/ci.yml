name: CI

on:
  push:
    branches: [development, main, master]
  pull_request:
    branches: [development, main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify migrations on a clean database
        run: npm run migrate:check
      - name: Lint and syntax checks
        run: npm run lint
      - name: Type-oriented static checks
        run: npm run typecheck
      - name: Production build validation
        run: npm run build

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [backend, frontend, integration, e2e]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run ${{ matrix.suite }} tests
        run: npm run test:${{ matrix.suite }}

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Reject committed runtime secrets and databases
        working-directory: .
        run: |
          test -z "$(git ls-files '*.sqlite' '*.sqlite3' '.env' '.env.*' | grep -vE '(^|/)\.env\.example$')"
          ! git grep -nE '(MANAGER_PASSWORD|SESSION_SECRET)=[^$]' -- ':!JOBSEARCH_MANAGER_IMPLEMENTATION_PROMPT.md' ':!.env.example'

